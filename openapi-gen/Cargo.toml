[package]
name = "openapi-gen"
version = "0.0.0"
edition = "2021"
publish = false

# Native-only binary. The worker crate is wasm-only, so we cannot reuse its
# handler types directly — schemas here are hand-mirrored from worker/src/api.
# Build: `cargo run -p openapi-gen` (writes openapi.json at the repo root).

[[bin]]
name = "openapi-gen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["preserve_order", "preserve_path_order"] }
