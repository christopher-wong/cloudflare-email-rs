[package]
name = "cfemail-api-types"
version = "0.1.0"
edition = "2021"
publish = false

# Plain serde + utoipa structs shared between `worker/` (wasm) and
# `openapi-gen/` (native). MUST NOT pull in wasm-only or native-only
# deps — keep this crate's dependency surface boring.

[lib]
name = "api_types"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# utoipa is mostly proc-macros (compile-time) + a small runtime crate.
# Verified to compile under wasm32-unknown-unknown — see the README in
# this crate for the why.
utoipa = { version = "5", features = ["preserve_order"] }
